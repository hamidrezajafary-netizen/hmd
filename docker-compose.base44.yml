# Base44 dev environment for the bed booking site.
#
# Everything runs from this checkout, not from a prebuilt image:
#   db       — PostgreSQL, the only database. Bookings and beds live here.
#   migrate  — one-shot: installs API dependencies, creates the schema, reseeds beds.
#   api      — Express JSON API on 4000 (dev, node --watch).
#   web      — Vite dev server on host port 3000, proxies /api to the api service.
#
# Single origin on purpose: the browser only ever talks to port 3000.

name: bed-booking

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: beds
      POSTGRES_PASSWORD: beds
      POSTGRES_DB: beds
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beds -d beds || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: node:22
    working_dir: /app
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://beds:beds@db:5432/beds
    # Only this service installs server dependencies, so two installers never
    # touch the shared volume at the same time.
    command: ["sh", "-ec", "npm install --no-audit --no-fund && npm run migrate"]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: node:22
    init: true
    restart: on-failure
    working_dir: /app
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    environment:
      PORT: 4000
      DATABASE_URL: postgres://beds:beds@db:5432/beds
    command: ["sh", "-ec", "exec npm run dev"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    image: node:22
    init: true
    restart: on-failure
    working_dir: /app
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      # Bare pass-through: the platform supplies these, we never hardcode them.
      # BASE44_PREVIEW_MODE gates the sandbox-only dev-host allowlist in vite.config.js.
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:3000"
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

volumes:
  db_data:
  server_node_modules:
  web_node_modules:
